apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: training-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/l-and-d/lnd
    targetRevision: main
    path: helm/services/ld-training-service
    helm:
      releaseName: training-service
      valueFiles:
      - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true